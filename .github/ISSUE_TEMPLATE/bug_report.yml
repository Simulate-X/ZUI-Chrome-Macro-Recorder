name: Bug report
description: Report a reproducible ZUI Macro Recorder for Chrome problem without sharing private macro data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real macro JSON, cookies, tokens, passwords, account details, browser profiles, or unredacted diagnostics. Use a synthetic reproduction whenever possible.
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: e.g. 153.0.x
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: e.g. 0.6.0
    validations:
      required: true
  - type: input
    id: site-type
    attributes:
      label: Site type or domain (optional)
      description: A generic class such as canvas app, SPA, form site, or a non-sensitive domain is enough.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use harmless actions and synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Technical error code
      description: Copy only the stable technical code, not private page or macro content.
  - type: dropdown
    id: diagnostics
    attributes:
      label: Redacted diagnostics available?
      options:
        - "No"
        - "Yes, but not attached publicly"
        - "Yes, synthetic-only"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, account data, real macro exports, cookies, tokens, and personal identifiers.
          required: true

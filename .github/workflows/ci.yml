name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reliable-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts --package-lock=false
      - name: Static checks
        run: npm run check
      - name: Unit and contract tests
        run: npm test
      - name: Build and manifest/package audit
        run: npm run build

      # Browser-heavy MV3, GUI permission prompts and real-site compatibility
      # remain explicit local/manual release gates; CI does not fake them green.
